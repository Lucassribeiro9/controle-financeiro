{% extends "base.html" %}
{% load static %}

{% block title %}Importar extrato - Controle Financeiro{% endblock %}

{% block page_css %}<link rel="stylesheet" href="{% static 'css/pages/imports.css' %}">{% endblock %}

{% block content %}
    <a class="import-back" href="{% url 'imports:review-page' %}">&lsaquo; Importações</a>

    <header class="import-header">
        <div class="import-header__text">
            <h1>Importar extrato</h1>
            <p class="import-header__hint">OFX, XLSX ou CSV do banco</p>
        </div>
    </header>

    <form class="import-upload" method="post" action="{% url 'imports:upload-page' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <label class="import-drop">
            <span class="import-drop__icon" aria-hidden="true">&#8679;</span>
            <span class="import-drop__title">Escolher arquivo</span>
            <span class="import-drop__hint">.ofx, .xlsx ou .csv</span>
            <input type="file" name="file" accept=".csv,.xlsx,.ofx" required>
        </label>

        <div class="card import-upload__fields">
            <label class="field">
                <span class="field__label">Formato do arquivo</span>
                <select name="source_type" required>
                    {% for value, label in source_types %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span class="field__label">Banco do CSV</span>
                <select name="csv_profile">
                    {% for value, label in csv_profiles %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <small class="import-hint">Só vale para CSV. Escolha Nubank ou Inter para importar o arquivo do banco sem editar.</small>
            </label>

            <label class="field">
                <span class="field__label">Conta sugerida</span>
                <select name="account_id">
                    <option value="">Sem conta sugerida</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}">{{ account.name }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>

        <button class="btn btn--primary import-upload__submit" type="submit">Enviar para revisão</button>
    </form>
{% endblock %}
