{# Mes e ano por GET. Parametro: action (URL de destino). Classes locais gl-* (pages/goals.css). #}
<form class="gl-period-fields" method="get" action="{{ action }}">
    <label class="field">
        <span class="field__label">Mês</span>
        <input name="month" type="text" inputmode="numeric" pattern="\d*" min="1" max="12" value="{{ month }}" required>
    </label>
    <label class="field">
        <span class="field__label">Ano</span>
        <input name="year" type="text" inputmode="numeric" pattern="\d*" min="2000" value="{{ year }}" required>
    </label>
    <button class="btn btn--secondary" type="submit">Aplicar período</button>
</form>
