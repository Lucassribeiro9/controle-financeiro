{# Barra inferior do celular (abaixo de 768px). So com usuario autenticado. #}
{% if user.is_authenticated %}
{% load navigation %}
{% nav_state as nav %}
<nav class="bottom-nav" aria-label="Navegação inferior">
    <a class="bottom-nav__item" href="/"{% if nav.section == "home" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-9.5Z"></path></svg>
        <span>Início</span>
    </a>
    <a class="bottom-nav__item" href="/transactions/"{% if nav.section == "transactions" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
        <span>Lançamentos</span>
    </a>
    <a class="bottom-nav__add" href="/transactions/create/" aria-label="Novo lançamento">
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a class="bottom-nav__item" href="/cards/statements/"{% if nav.section == "statements" %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path></svg>
        <span>Faturas</span>
    </a>
    <button class="bottom-nav__item" type="button" popovertarget="more-sheet" aria-expanded="false"{% if nav.in_more %} aria-current="true"{% endif %}>
        <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
        <span>Mais</span>
    </button>
</nav>
{% endif %}
