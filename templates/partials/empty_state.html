{# Componente de estado vazio reutilizável (.empty do components.css) #}
{# Parâmetros: title, description, cta_label (opcional), cta_url (opcional) #}

<div class="empty">
    <div>
        <strong class="empty__title">{{ title }}</strong>
        <span class="empty__description">{{ description }}</span>
    </div>
    {% if cta_label and cta_url %}
        <a class="btn btn--secondary" href="{{ cta_url }}">
            {{ cta_label }}
        </a>
    {% endif %}
</div>
