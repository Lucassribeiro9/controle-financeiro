{# Controle de tema (Claro, Escuro, Sistema). Escondido ate o layout.js revelar; sem id nem name, pode aparecer mais de uma vez. #}
<div class="theme-switch segmented" role="group" aria-label="Tema" hidden>
    <button class="segmented__item" type="button" data-theme-choice="light" aria-pressed="false">Claro</button>
    <button class="segmented__item" type="button" data-theme-choice="dark" aria-pressed="false">Escuro</button>
    <button class="segmented__item" type="button" data-theme-choice="system" aria-pressed="false">Sistema</button>
</div>
